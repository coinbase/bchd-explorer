server {
  listen 80;
  server_tokens off;

  # Security headers applied to every response of this static site.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # The explorer opens gRPC-Web connections to user-selected third-party bchd
  # nodes, so connect-src is intentionally broad (any https/wss host); every
  # other directive is locked to the origin (plus the Font Awesome CDN script
  # referenced by index.html).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://use.fontawesome.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https: wss:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  error_page   500 502 503 504  /50x.html;

  location = /50x.html {
    root   /usr/share/nginx/html;
  }
}
